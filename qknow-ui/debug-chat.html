<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text2Cypher API 调试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .result {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            margin-top: 10px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e8;
            color: #2e7d32;
        }
        .info {
            background: #e3f2fd;
            color: #1565c0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .response-details {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 3px;
        }
        .response-section {
            margin: 10px 0;
            padding: 10px;
            border-left: 3px solid #007bff;
            background: white;
        }
        .response-section h4 {
            margin: 0 0 10px 0;
            color: #007bff;
        }
        .cypher-query {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            border: 1px solid #e9ecef;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .data-table th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Text2Cypher API 调试页面</h1>
    
    <div class="test-section">
        <h3>健康检查</h3>
        <button onclick="testHealth()">检查服务健康状态</button>
        <div id="health-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>问答调试测试</h3>
        <textarea id="question" placeholder="请输入您的问题，例如：查询所有人员信息" rows="3"></textarea>
        <button onclick="testQuestion()">发送问题</button>
        <div id="question-result" class="result"></div>
        <div id="response-details" class="response-details" style="display: none;"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8003/api/v1';
        
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${url}`, {
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    ...options
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('Request failed:', error);
                throw error;
            }
        }
        
        function showResult(elementId, data, isError = false, isInfo = false) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            
            let className = 'result';
            if (isError) className += ' error';
            else if (isInfo) className += ' info';
            else className += ' success';
            
            element.className = className;
        }
        
        function showResponseDetails(response) {
            const detailsDiv = document.getElementById('response-details');
            detailsDiv.style.display = 'block';
            
            let html = '<h3>响应详情分析</h3>';
            
            // 基本信息
            html += '<div class="response-section">';
            html += '<h4>基本信息</h4>';
            html += `<p><strong>Success:</strong> ${response.success}</p>`;
            if (response.message) {
                html += `<p><strong>Message:</strong> ${response.message}</p>`;
            }
            if (response.execution_time) {
                html += `<p><strong>执行时间:</strong> ${response.execution_time.toFixed(2)}秒</p>`;
            }
            html += '</div>';
            
            // 结果分析
            if (response.result) {
                const result = response.result;
                
                // Cypher查询
                if (result.cypher) {
                    html += '<div class="response-section">';
                    html += '<h4>生成的Cypher查询</h4>';
                    html += `<div class="cypher-query">${result.cypher}</div>`;
                    html += '</div>';
                }
                
                // 问题
                if (result.question) {
                    html += '<div class="response-section">';
                    html += '<h4>原始问题</h4>';
                    html += `<p>${result.question}</p>`;
                    html += '</div>';
                }
                
                // 答案
                if (result.answer) {
                    html += '<div class="response-section">';
                    html += '<h4>LLM答案</h4>';
                    html += `<p>${result.answer}</p>`;
                    html += '</div>';
                }
                
                // 解释
                if (result.explanation) {
                    html += '<div class="response-section">';
                    html += '<h4>LLM解释</h4>';
                    html += `<p>${result.explanation}</p>`;
                    html += '</div>';
                }
                
                // 执行结果
                if (result.execution_result) {
                    html += '<div class="response-section">';
                    html += '<h4>数据库执行结果</h4>';
                    html += `<p><strong>结果数量:</strong> ${result.execution_result.length}</p>`;
                    
                    if (result.execution_result.length > 0) {
                        html += '<table class="data-table">';
                        
                        // 表头
                        const firstRow = result.execution_result[0];
                        html += '<tr>';
                        for (const key in firstRow) {
                            html += `<th>${key}</th>`;
                        }
                        html += '</tr>';
                        
                        // 数据行
                        result.execution_result.forEach(row => {
                            html += '<tr>';
                            for (const key in firstRow) {
                                const value = row[key] || '';
                                html += `<td>${value}</td>`;
                            }
                            html += '</tr>';
                        });
                        
                        html += '</table>';
                    }
                    html += '</div>';
                }
                
                // 其他字段
                const otherFields = {};
                for (const key in result) {
                    if (!['cypher', 'question', 'answer', 'explanation', 'execution_result'].includes(key)) {
                        otherFields[key] = result[key];
                    }
                }
                
                if (Object.keys(otherFields).length > 0) {
                    html += '<div class="response-section">';
                    html += '<h4>其他字段</h4>';
                    html += `<pre>${JSON.stringify(otherFields, null, 2)}</pre>`;
                    html += '</div>';
                }
            }
            
            // 错误信息
            if (response.error_message || response.error_code) {
                html += '<div class="response-section">';
                html += '<h4>错误信息</h4>';
                if (response.error_code) {
                    html += `<p><strong>错误代码:</strong> ${response.error_code}</p>`;
                }
                if (response.error_message) {
                    html += `<p><strong>错误消息:</strong> ${response.error_message}</p>`;
                }
                html += '</div>';
            }
            
            detailsDiv.innerHTML = html;
        }
        
        async function testHealth() {
            try {
                const result = await makeRequest('/health');
                showResult('health-result', result);
            } catch (error) {
                showResult('health-result', { error: error.message }, true);
            }
        }
        
        async function testQuestion() {
            const question = document.getElementById('question').value.trim();
            if (!question) {
                showResult('question-result', { error: '请输入问题' }, true);
                return;
            }
            
            try {
                const data = {
                    llm_name: "ark-model",
                    database_name: "neo4j",
                    workflow_type: "text2cypher_with_1_retry_and_output_check",
                    input_text: question,
                    context: {
                        graph_context: "调试环境"
                    },
                    timeout: 60
                };
                
                console.log('发送请求数据:', data);
                
                const result = await makeRequest('/workflow/execute', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                console.log('API响应:', result);
                
                showResult('question-result', result);
                showResponseDetails(result);
                
            } catch (error) {
                showResult('question-result', { error: error.message }, true);
            }
        }
        
        // 页面加载时自动检查健康状态
        window.onload = function() {
            testHealth();
        };
    </script>
</body>
</html>
